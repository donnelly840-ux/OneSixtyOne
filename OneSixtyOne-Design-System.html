document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

family:'Cabinet Grotesk',sans-serif; font-weight:800; font-size:22px; letter-spacing:-0.03em;\">OneSixtyOne<\u002Fdiv>\n        <div style=\"display:flex; gap:36px;\">\n          <a href=\"#\" style=\"font-family:'DM Mono',monospace; font-size:12px; letter-spacing:0.14em; text-transform:uppercase; color:rgba(254,252,238,0.6); text-decoration:none; transition:color 0.2s;\" style-hover=\"color:#FEFCEE\">Who we are<\u002Fa>\n          <a href=\"#\" style=\"font-family:'DM Mono',monospace; font-size:12px; letter-spacing:0.14em; text-transform:uppercase; color:rgba(254,252,238,0.6); text-decoration:none; transition:color 0.2s;\" style-hover=\"color:#FEFCEE\">What we do<\u002Fa>\n          <a href=\"#\" style=\"font-family:'DM Mono',monospace; font-size:12px; letter-spacing:0.14em; text-transform:uppercase; color:rgba(254,252,238,0.6); text-decoration:none; transition:color 0.2s;\" style-hover=\"color:#FEFCEE\">How we do it<\u002Fa>\n        <\u002Fdiv>\n        <button style=\"font-family:'DM Sans',sans-serif; font-weight:500; font-size:12px; letter-spacing:0.1em; text-transform:uppercase; background:#FEFCEE; color:#000; border:none; border-radius:2px; padding:13px 24px; cursor:pointer; transition:opacity 0.2s;\" style-hover=\"opacity:0.85\">Contact<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ PILLAR CARDS ============ -->\n  <section style=\"border-top:1px solid rgba(254,252,238,0.12); padding:130px 48px;\">\n    <div style=\"max-width:1120px; margin:0 auto;\">\n      <div style=\"display:flex; gap:16px; align-items:baseline; margin-bottom:72px;\">\n        <div style=\"font-family:'DM Mono',monospace; font-size:12px; letter-spacing:0.18em; text-transform:uppercase; color:rgba(254,252,238,0.45);\">07<\u002Fdiv>\n        <div style=\"font-family:'DM Mono',monospace; font-size:12px; letter-spacing:0.18em; text-transform:uppercase; color:rgba(254,252,238,0.7);\">Content cards<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:repeat(2,1fr); gap:1px; border:1px solid rgba(254,252,238,0.14); background:rgba(254,252,238,0.14);\">\n        <sc-for list=\"{{ pillars }}\" as=\"p\" hint-placeholder-count=\"4\">\n          <div style=\"background:#000; padding:clamp(32px,4vw,56px); min-height:280px; display:flex; flex-direction:column; justify-content:space-between;\">\n            <div style=\"font-family:'DM Mono',monospace; font-size:12px; letter-spacing:0.16em; text-transform:uppercase; color:rgba(254,252,238,0.4);\">{{ p.tag }}<\u002Fdiv>\n            <div>\n              <h3 style=\"font-family:'Cabinet Grotesk',sans-serif; font-weight:700; font-size:clamp(26px,3vw,38px); line-height:1.05; letter-spacing:-0.02em; margin:0 0 18px;\">{{ p.title }}<\u002Fh3>\n              <p style=\"font-family:'DM Sans',sans-serif; font-size:16px; line-height:1.6; color:rgba(254,252,238,0.6); margin:0; max-width:380px;\">{{ p.body }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ PROCESS ============ -->\n  <section style=\"border-top:1px solid rgba(254,252,238,0.12); padding:130px 48px;\">\n    <div style=\"max-width:1120px; margin:0 auto;\">\n      <div style=\"display:flex; gap:16px; align-items:baseline; margin-bottom:72px;\">\n        <div style=\"font-family:'DM Mono',monospace; font-size:12px; letter-spacing:0.18em; text-transform:uppercase; color:rgba(254,252,238,0.45);\">08<\u002Fdiv>\n        <div style=\"font-family:'DM Mono',monospace; font-size:12px; letter-spacing:0.18em; text-transform:uppercase; color:rgba(254,252,238,0.7);\">Process steps<\u002Fdiv>\n      <\u002Fdiv>\n      <sc-for list=\"{{ steps }}\" as=\"s\" hint-placeholder-count=\"4\">\n        <div style=\"display:grid; grid-template-columns:120px 1fr; gap:40px; align-items:start; padding:36px 0; border-top:1px solid rgba(254,252,238,0.12);\">\n          <div style=\"font-family:'Cabinet Grotesk',sans-serif; font-weight:800; font-size:48px; letter-spacing:-0.03em; color:rgba(254,252,238,0.3); line-height:1;\">{{ s.num }}<\u002Fdiv>\n          <div style=\"display:flex; flex-wrap:wrap; gap:8px 48px; align-items:baseline;\">\n            <h3 style=\"font-family:'Cabinet Grotesk',sans-serif; font-weight:700; font-size:clamp(24px,2.6vw,32px); letter-spacing:-0.02em; margin:0; min-width:200px;\">{{ s.title }}<\u002Fh3>\n            <p style=\"font-family:'DM Sans',sans-serif; font-size:16px; line-height:1.6; color:rgba(254,252,238,0.6); margin:0; max-width:520px; flex:1;\">{{ s.body }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ FAQ ACCORDION ============ -->\n  <section style=\"border-top:1px solid rgba(254,252,238,0.12); padding:130px 48px;\">\n    <div style=\"max-width:1120px; margin:0 auto;\">\n      <div style=\"display:flex; gap:16px; align-items:baseline; margin-bottom:72px;\">\n        <div style=\"font-family:'DM Mono',monospace; font-size:12px; letter-spacing:0.18em; text-transform:uppercase; color:rgba(254,252,238,0.45);\">09<\u002Fdiv>\n        <div style=\"font-family:'DM Mono',monospace; font-size:12px; letter-spacing:0.18em; text-transform:uppercase; color:rgba(254,252,238,0.7);\">Accordion<\u002Fdiv>\n      <\u002Fdiv>\n      <sc-for list=\"{{ faqs }}\" as=\"f\" hint-placeholder-count=\"4\">\n        <div onclick=\"{{ f.toggle }}\" style=\"border-top:1px solid rgba(254,252,238,0.14); padding:32px 0; cursor:pointer;\">\n          <div style=\"display:flex; justify-content:space-between; align-items:baseline; gap:24px;\">\n            <h3 style=\"font-family:'Cabinet Grotesk',sans-serif; font-weight:700; font-size:clamp(20px,2.4vw,28px); letter-spacing:-0.02em; margin:0;\">{{ f.q }}<\u002Fh3>\n            <div style=\"font-family:'DM Mono',monospace; font-size:20px; color:rgba(254,252,238,0.5); flex:none;\">{{ f.sign }}<\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ f.open }}\" hint-placeholder-val=\"{{ false }}\">\n            <p style=\"font-family:'DM Sans',sans-serif; font-size:17px; line-height:1.65; color:rgba(254,252,238,0.6); margin:20px 0 0; max-width:680px;\">{{ f.a }}<\u002Fp>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ CONTACT FORM ============ -->\n  <section style=\"border-top:1px solid rgba(254,252,238,0.12); padding:130px 48px;\">\n    <div style=\"max-width:1120px; margin:0 auto;\">\n      <div style=\"display:flex; gap:16px; align-items:baseline; margin-bottom:72px;\">\n        <div style=\"font-family:'DM Mono',monospace; font-size:12px; letter-spacing:0.18em; text-transform:uppercase; color:rgba(254,252,238,0.45);\">10<\u002Fdiv>\n        <div style=\"font-family:'DM Mono',monospace; font-size:12px; letter-spacing:0.18em; text-transform:uppercase; color:rgba(254,252,238,0.7);\">Form<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:1fr 1.4fr; gap:64px; align-items:start;\">\n        <div>\n          <h2 style=\"font-family:'Cabinet Grotesk',sans-serif; font-weight:800; font-size:clamp(32px,4vw,52px); line-height:1; letter-spacing:-0.03em; margin:0;\">Let's talk.<\u002Fh2>\n          <p style=\"font-family:'DM Sans',sans-serif; font-size:16px; line-height:1.6; color:rgba(254,252,238,0.6); margin:24px 0 0;\">Tell us what you're building. We read everything.<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-family:'DM Mono',monospace; font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:rgba(254,252,238,0.45); margin-bottom:16px;\">What are you looking for?<\u002Fdiv>\n          <div style=\"display:flex; flex-wrap:wrap; gap:12px; margin-bottom:40px;\">\n            <sc-for list=\"{{ chips }}\" as=\"c\" hint-placeholder-count=\"3\">\n              <button onclick=\"{{ c.toggle }}\" style=\"{{ c.style }}\">{{ c.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:0;\">\n            <input placeholder=\"Name\" style=\"font-family:'DM Sans',sans-serif; font-size:16px; color:#FEFCEE; background:transparent; border:none; border-bottom:1px solid rgba(254,252,238,0.2); padding:18px 0; outline:none;\">\n            <input placeholder=\"Email\" style=\"font-family:'DM Sans',sans-serif; font-size:16px; color:#FEFCEE; background:transparent; border:none; border-bottom:1px solid rgba(254,252,238,0.2); padding:18px 0; outline:none;\">\n            <textarea placeholder=\"Tell us about the project\" rows=\"3\" style=\"font-family:'DM Sans',sans-serif; font-size:16px; color:#FEFCEE; background:transparent; border:none; border-bottom:1px solid rgba(254,252,238,0.2); padding:18px 0; outline:none; resize:none;\"><\u002Ftextarea>\n          <\u002Fdiv>\n          <button style=\"font-family:'DM Sans',sans-serif; font-weight:500; font-size:12px; letter-spacing:0.1em; text-transform:uppercase; background:#FEFCEE; color:#000; border:none; border-radius:2px; padding:18px 40px; cursor:pointer; margin-top:36px; transition:opacity 0.2s;\" style-hover=\"opacity:0.85\">Send it<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ TEXTURE & MOTION ============ -->\n  <section style=\"border-top:1px solid rgba(254,252,238,0.12); padding:130px 48px;\">\n    <div style=\"max-width:1120px; margin:0 auto;\">\n      <div style=\"display:flex; gap:16px; align-items:baseline; margin-bottom:72px;\">\n        <div style=\"font-family:'DM Mono',monospace; font-size:12px; letter-spacing:0.18em; text-transform:uppercase; color:rgba(254,252,238,0.45);\">11<\u002Fdiv>\n        <div style=\"font-family:'DM Mono',monospace; font-size:12px; letter-spacing:0.18em; text-transform:uppercase; color:rgba(254,252,238,0.7);\">Texture &amp; motion<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:repeat(3,1fr); gap:24px;\">\n        <div style=\"border:1px solid rgba(254,252,238,0.14); padding:36px; min-height:200px; display:flex; flex-direction:column; justify-content:flex-end; gap:14px;\">\n          <div style=\"font-family:'DM Mono',monospace; font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:rgba(254,252,238,0.7);\">Film grain<\u002Fdiv>\n          <div style=\"font-family:'DM Sans',sans-serif; font-size:14px; line-height:1.55; color:rgba(254,252,238,0.55);\">A very faint grain sits over every background — soft-light, ~5% — for warmth and tactility. It's on this page right now.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid rgba(254,252,238,0.14); padding:36px; min-height:200px; display:flex; flex-direction:column; justify-content:flex-end; gap:14px;\">\n          <div style=\"font-family:'DM Mono',monospace; font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:rgba(254,252,238,0.7);\">Negative space<\u002Fdiv>\n          <div style=\"font-family:'DM Sans',sans-serif; font-size:14px; line-height:1.55; color:rgba(254,252,238,0.55);\">Let things breathe. Sharp, editorial, magazine-like — not rounded, not bubbly. One idea per view.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid rgba(254,252,238,0.14); padding:36px; min-height:200px; display:flex; flex-direction:column; justify-content:flex-end; gap:14px;\">\n          <div style=\"font-family:'DM Mono',monospace; font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:rgba(254,252,238,0.7);\">Motion<\u002Fdiv>\n          <div style=\"font-family:'DM Sans',sans-serif; font-size:14px; line-height:1.55; color:rgba(254,252,238,0.55);\">Restrained. Slow opacity and underline transitions (0.2s). Nothing bounces. Confidence, not flash.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ FOOTER ============ -->\n  <footer style=\"border-top:1px solid rgba(254,252,238,0.12); padding:96px 48px 56px;\">\n    <div style=\"max-width:1120px; margin:0 auto;\">\n      <div style=\"display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:40px; margin-bottom:80px;\">\n        <div style=\"font-family:'Cabinet Grotesk',sans-serif; font-weight:800; font-size:clamp(40px,7vw,96px); line-height:0.9; letter-spacing:-0.03em;\">OneSixtyOne<\u002Fdiv>\n        <a href=\"#\" style=\"font-family:'DM Mono',monospace; font-size:13px; letter-spacing:0.14em; text-transform:uppercase; color:#FEFCEE; text-decoration:none; border-bottom:1px solid rgba(254,252,238,0.3); padding-bottom:6px;\">hello@onesixtyone.co<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:24px; font-family:'DM Mono',monospace; font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:rgba(254,252,238,0.4);\">\n        <div>© 2026 One Sixty One<\u002Fdiv>\n        <div style=\"display:flex; gap:28px;\">\n          <a href=\"#\" style=\"color:rgba(254,252,238,0.4); text-decoration:none; transition:color 0.2s;\" style-hover=\"color:#FEFCEE\">Instagram<\u002Fa>\n          <a href=\"#\" style=\"color:rgba(254,252,238,0.4); text-decoration:none; transition:color 0.2s;\" style-hover=\"color:#FEFCEE\">LinkedIn<\u002Fa>\n          <a href=\"#\" style=\"color:rgba(254,252,238,0.4); text-decoration:none; transition:color 0.2s;\" style-hover=\"color:#FEFCEE\">Behance<\u002Fa>\n        <\u002Fdiv>\n        <div>Brand system v1.0<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = {\n    openFaq: 0,\n    chips: { \"Brand Strategy\": true, \"Creative & Design\": false, \"Web\": false }\n  };\n\n  renderVals() {\n    const bone = (o) => `rgba(254,252,238,${o})`;\n\n    const scale = [\n      { label: \"Display\", meta: \"Cabinet 800 · 96\", style: \"font-family:'Cabinet Grotesk',sans-serif;font-weight:800;font-size:72px;line-height:1;letter-spacing:-0.03em\", sample: \"Make it mean something\" },\n      { label: \"Heading 1\", meta: \"Cabinet 800 · 56\", style: \"font-family:'Cabinet Grotesk',sans-serif;font-weight:800;font-size:52px;line-height:1;letter-spacing:-0.03em\", sample: \"We build brands\" },\n      { label: \"Heading 2\", meta: \"Cabinet 700 · 36\", style: \"font-family:'Cabinet Grotesk',sans-serif;font-weight:700;font-size:36px;line-height:1.05;letter-spacing:-0.02em\", sample: \"Strategy, design & web\" },\n      { label: \"Heading 3\", meta: \"Cabinet 700 · 26\", style: \"font-family:'Cabinet Grotesk',sans-serif;font-weight:700;font-size:26px;letter-spacing:-0.02em\", sample: \"No templates, no filler\" },\n      { label: \"Body Large\", meta: \"DM Sans 400 · 22\", style: \"font-family:'DM Sans',sans-serif;font-weight:400;font-size:22px;line-height:1.6;color:\" + bone(0.85), sample: \"A small, founder-led creative agency.\" },\n      { label: \"Body\", meta: \"DM Sans 400 · 17\", style: \"font-family:'DM Sans',sans-serif;font-weight:400;font-size:17px;line-height:1.6;color:\" + bone(0.65), sample: \"Restrained and confident, not loud or colorful.\" },\n      { label: \"Caption\", meta: \"DM Sans 400 · 14\", style: \"font-family:'DM Sans',sans-serif;font-weight:400;font-size:14px;line-height:1.5;color:\" + bone(0.5), sample: \"Contrast and typography do the work.\" },\n      { label: \"Label / Mono\", meta: \"DM Mono · 12 · CAPS\", style: \"font-family:'DM Mono',monospace;font-size:12px;letter-spacing:0.2em;text-transform:uppercase;color:\" + bone(0.7), sample: \"Brand · Strategy · Web\" }\n    ];\n\n    const pillars = [\n      { tag: \"01 / Approach\", title: \"No templates.\", body: \"Every brand starts from a blank page and a real conversation. Nothing is reused because it was convenient.\" },\n      { tag: \"02 / Strategy\", title: \"Strategy first.\", body: \"We find what the brand is actually about before a single pixel moves. Clarity is the deliverable.\" },\n      { tag: \"03 / Craft\", title: \"Made to last.\", body: \"Editorial, typographic, high-contrast work that still looks right in five years — not five weeks.\" },\n      { tag: \"04 / Partnership\", title: \"Founder-led.\", body: \"You work directly with the people doing the work. Small by choice, close by default.\" }\n    ];\n\n    const steps = [\n      { num: \"01\", title: \"Discovery\", body: \"Conversations, audits and questions. We learn the business before we touch the brand.\" },\n      { num: \"02\", title: \"Strategy\", body: \"Positioning, narrative and the single idea everything else hangs from.\" },\n      { num: \"03\", title: \"Creative\", body: \"Identity, type system, art direction and the website to carry it all.\" },\n      { num: \"04\", title: \"Launch\", body: \"We ship it, hand over the system, and stay close while it finds its feet.\" }\n    ];\n\n    const faqData = [\n      { q: \"What do you actually do?\", a: \"Brand strategy, identity design, and the websites that carry them. Founder-led, end to end — no account managers in between.\" },\n      { q: \"How long does a project take?\", a: \"A full brand and site is typically 6–10 weeks. Strategy sprints are shorter; ongoing partnerships run as long as they're useful.\" },\n      { q: \"Do you work with early-stage founders?\", a: \"Often. If you know what you're building and want it to look like you mean it, stage matters less than clarity.\" },\n      { q: \"Do you use templates?\", a: \"No. Every engagement starts from a blank page. That's the whole point — and the first line of this system.\" }\n    ];\n\n    const faqs = faqData.map((f, i) => ({\n      q: f.q,\n      a: f.a,\n      open: this.state.openFaq === i,\n      sign: this.state.openFaq === i ? \"–\" : \"+\",\n      toggle: () => this.setState(s => ({ openFaq: s.openFaq === i ? -1 : i }))\n    }));\n\n    const chipBase = \"font-family:'DM Mono',monospace;font-size:12px;letter-spacing:0.14em;text-transform:uppercase;padding:12px 20px;cursor:pointer;transition:all 0.2s;border:1px solid \";\n    const chips = Object.keys(this.state.chips).map(label => {\n      const on = this.state.chips[label];\n      const style = chipBase + (on\n        ? \"#FEFCEE;background:#FEFCEE;color:#000;\"\n        : \"rgba(254,252,238,0.3);background:transparent;color:\" + bone(0.6) + \";\");\n      return {\n        label,\n        style,\n        toggle: () => this.setState(s => ({ chips: { ...s.chips, [label]: !s.chips[label] } }))\n      };\n    });\n\n    return { scale, pillars, steps, faqs, chips };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
