<!--
  BLUR-FOCUS TEXT REVEAL  (archived from onesixtyone.co homepage, Aug 2026)
  Paragraphs start blurred + dimmed and "focus in" as they enter the viewport,
  one after another. IntersectionObserver adds .who-p-in per paragraph.
  Cheap to reuse: rename .who-copy to whatever wrapper you need.
  Note: filter: blur() animation is GPU-expensive on mobile — use sparingly.
-->
<style>
@media (prefers-reduced-motion: reduce) {
            .who-copy p { filter: none !important; opacity: 1 !important; }
}
/* During scroll-restore on refresh: snap in-view reveals instantly (no empty flash, no replayed fade) */
        html.oso-instant .reveal,
        html.oso-instant .seq-reveal,
        html.oso-instant .who-copy p,
        html.oso-instant #who-principles .who-principle,
        html.oso-instant .process-card { transition: none !important; }
.who-copy {
            display: flex;
            flex-direction: column;
            gap: 28px;
            max-width: 48ch;
            text-align: right;
        }
.who-copy p {
            font-size: clamp(15px, 1.4vw, 18px);
            line-height: 1.8;
            color: rgba(255,255,255,0.65);
            overflow-wrap: break-word;
            filter: blur(6px);
            opacity: 0.18;
            transition: filter 1.1s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.9s ease;
        }
.who-copy p.who-p-in {
            filter: blur(0);
            opacity: 1;
        }
@media (max-width: 768px) {
            .who-copy { text-align: left; max-width: none; }
}
@media (min-width: 1600px) {
            .who-copy p { font-size: 20px; }
            .who-copy { gap: 36px; }
}
@media (min-width: 1920px) {
            .who-copy { max-width: 54ch; gap: 40px; }
            .who-copy p { font-size: 22px; }
}
</style>

<div class="who-copy">
  <p>First paragraph.</p>
  <p>Second paragraph.</p>
</div>

<script>
/* ── Who copy — blur reveal ─────────────────────────── */
(function () {
    var paras = document.querySelectorAll('.who-copy p');
    if (!paras.length) return;
    if (!('IntersectionObserver' in window)) {
        paras.forEach(function (p) { p.classList.add('who-p-in'); });
        return;
    }
    var pIO = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
            if (entry.isIntersecting) {
                entry.target.classList.add('who-p-in');
                pIO.unobserve(entry.target);
            }
        });
    }, { threshold: 0.25, rootMargin: '0px 0px -40px 0px' });
    paras.forEach(function (p) { pIO.observe(p); });
}());
</script>
